# Runs on every branch. A PR needs all five green before it merges.
name: ci
on:
  push:
    branches-ignore: [main]
jobs:
  frontend:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - run: make frontend
  backend:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - run: make backend
  integration:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - run: make integration
  browser:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - run: make browser PW_ARGS="--reporter=list,json"
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright.json
      # Forgejo has no job-log API, so put the failures on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged.
      - name: Post failures on the PR
        if: failure()
        continue-on-error: true
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "${{ runner.temp }}/playwright.json" ]; then
            node scripts/post-browser-failure.mjs "${{ runner.temp }}/playwright.json"
          else
            echo "No Playwright report; nothing to post."
          fi
  secret-scan:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history
        run: |
          v=8.30.1
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          cd /tmp
          curl -fsSLO "$base/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${v}_checksums.txt"
          grep linux_x64 "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks git --redact --exit-code 1 .
