# Runs on every branch except staging and production, including main after each merge. A PR needs every job green before it merges. On main there is no open PR, so the steps that post to a PR log "nothing to post" and pass.
name: ci
on:
  push:
    branches-ignore: [staging, production]
  workflow_dispatch:
jobs:
  frontend:
    runs-on: docker
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Run make frontend
        id: run
        run: |
          set -o pipefail
          make frontend 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: frontend
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: make frontend
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  facts:
    runs-on: docker
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Run make facts
        id: run
        run: |
          set -o pipefail
          make facts 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: facts
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: make facts
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  backend:
    runs-on: docker
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Run make backend
        id: run
        run: |
          set -o pipefail
          make backend 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: backend
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: make backend
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  integration:
    runs-on: docker
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Run make integration
        id: run
        run: |
          set -o pipefail
          make integration 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: integration
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: make integration
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  browser:
    runs-on: docker
    env:
      # tests/gpu.spec.ts skips unless CI is set, so don't leave it to the runner.
      CI: "true"
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      # CI only: the runner's GPU needs Mesa's drivers inside the job container.
      - name: Install the graphics drivers
        id: drivers
        run: |
          set -o pipefail
          { apt-get update && apt-get install -y --no-install-recommends libgl1-mesa-dri libegl-mesa0 libgbm1 mesa-vulkan-drivers; } 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      - name: Run make browser PW_ARGS="--reporter=list,json"
        id: run
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright.json
        run: |
          set -o pipefail
          make browser PW_ARGS="--reporter=list,json" 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: browser
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} drivers=${{ steps.drivers.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: make browser PW_ARGS="--reporter=list,json"
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          REPORT: ${{ runner.temp }}/playwright.json
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  # Takes every station at desktop and phone size on the GPU and puts them on the branch's open PR,
  # replacing the last push's comment. With no open PR it passes and attaches nothing. A shot that
  # can't be taken, or can't be attached, fails the job.
  screenshots:
    runs-on: docker
    # Two quick pushes would race on the PR's screenshot comment and images: the newer run wins.
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Find the open PR
        id: pr
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-screenshots.mjs find
      # CI only: the same drivers as the browser job.
      - name: Install the graphics drivers
        id: drivers
        if: steps.pr.outputs.pr != ''
        run: |
          set -o pipefail
          { apt-get update && apt-get install -y --no-install-recommends libgl1-mesa-dri libegl-mesa0 libgbm1 mesa-vulkan-drivers; } 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      - name: Take the screenshots
        id: run
        if: steps.pr.outputs.pr != ''
        env:
          SHOTS_DIR: ${{ runner.temp }}/shots
        run: |
          set -o pipefail
          { npm ci && npx playwright install --with-deps chromium && npx playwright test -c playwright.screenshots.config.ts --reporter=list; } 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      - name: Attach them to the PR
        id: post
        if: steps.pr.outputs.pr != ''
        env:
          PR: ${{ steps.pr.outputs.pr }}
          SHOTS_DIR: ${{ runner.temp }}/shots
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-screenshots.mjs post
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: screenshots
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} pr=${{ steps.pr.outcome }} drivers=${{ steps.drivers.outcome }} run=${{ steps.run.outcome }} post=${{ steps.post.outcome }}
          RUN_STEP: run
          CMD: npx playwright test -c playwright.screenshots.config.ts
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  secret-scan:
    runs-on: docker
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download gitleaks
        id: download
        run: |
          v=8.30.1
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          cd /tmp
          {
            curl -fsSLO "$base/gitleaks_${v}_linux_x64.tar.gz" &&
            curl -fsSLO "$base/gitleaks_${v}_checksums.txt" &&
            tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          } || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      - name: Check the gitleaks checksum
        id: checksum
        run: |
          v=8.30.1
          cd /tmp
          grep linux_x64 "gitleaks_${v}_checksums.txt" | sha256sum -c - || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      - name: Scan the full history
        id: scan
        run: |
          /tmp/gitleaks git --redact --exit-code 1 --report-format json --report-path "${{ runner.temp }}/leaks.json" . || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged. No log tail: only the redacted report.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: secret-scan
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} download=${{ steps.download.outcome }} checksum=${{ steps.checksum.outcome }} scan=${{ steps.scan.outcome }}
          RUN_STEP: scan
          CMD: gitleaks git
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          LEAKS_REPORT: ${{ runner.temp }}/leaks.json
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
