# Adham runs this to deploy to production. It points the production branch at one commit, so
# production gets that commit's chart and image together, and nothing else can change it.
# An older version is how you roll back.
name: promote
on:
  workflow_dispatch:
    inputs:
      version:
        description: Commit sha to deploy (7 to 40 hex characters). Leave empty for what's on staging.
        required: false
jobs:
  production:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Move the production branch
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            if ! git rev-parse --verify --quiet refs/remotes/origin/staging >/dev/null; then
              echo "There is no staging branch yet, so there is no staging version. Give a version, or merge to main so release creates it." >&2
              exit 1
            fi
            version=$(git show origin/staging:deploy/values-staging.yaml | sed -nE 's/^\s*tag: *"?([^"]*)"?.*/\1/p')
          fi
          # Whichever way version was set, accept only 7 to 40 lowercase hex characters before any
          # git or sed command sees it.
          case "$version" in
            ""|*[!0-9a-f]*) echo "Version is not a commit sha (7 to 40 hex characters)." >&2; exit 1 ;;
          esac
          if [ "${#version}" -lt 7 ] || [ "${#version}" -gt 40 ]; then
            echo "Version is not a commit sha (7 to 40 hex characters)." >&2
            exit 1
          fi
          version=$(git rev-parse --verify "$version^{commit}")
          git checkout --detach "$version"
          sed -i -E "s/^(\s*tag:).*/\1 \"$version\"/" deploy/values-production.yaml
          git config user.name forgejo-ci
          git config user.email ci@forgejo.local
          git commit -am "Deploy $version to production"
          git push --force origin HEAD:refs/heads/production
