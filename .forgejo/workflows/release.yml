# A merge to main builds the image, then deploys it to staging by writing its tag.
# Version commits don't trigger this again, because of paths-ignore.
name: release
on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/values-*.yaml
jobs:
  image:
    runs-on: docker
    container:
      image: ghcr.io/osscontainertools/kaniko:v1.29.0-debug
    steps:
      - name: Build and push
        env:
          GIT_USERNAME: forgejo
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # The job's own token can't push packages. This org secret can.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          host=git.tailf69bc5.ts.net
          mkdir -p /kaniko/.docker
          auth=$(printf 'adham:%s' "$REGISTRY_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$host" "$auth" > /kaniko/.docker/config.json
          /kaniko/executor \
            --context "git://$host/${{ github.repository }}.git#refs/heads/main#${{ github.sha }}" \
            --destination "$host/${{ github.repository }}:${{ github.sha }}"
  staging:
    needs: image
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Write the version
        run: |
          sed -i -E 's/^(\s*tag:).*/\1 "${{ github.sha }}"/' deploy/values-staging.yaml
          git config user.name forgejo-ci
          git config user.email ci@forgejo.local
          git commit -am "Deploy ${{ github.sha }} to staging"
          git push origin HEAD:main
