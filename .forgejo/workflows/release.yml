# A merge to main builds the image, runs the full browser suite and takes the screenshots, then deploys to
# staging: the staging job writes the tag into deploy/values-staging.yaml on the staging branch, the way promote
# does for production. Staging moves only when all three pass, so it never gets a commit the browser suite failed.
# Nothing here pushes to main, so a deploy adds no commit there and every merge to main runs this.
# Run it by hand on main to try again after a flaky failure: Forgejo can't re-run one job.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  image:
    runs-on: docker
    container:
      image: ghcr.io/osscontainertools/kaniko:v1.29.0-debug
    steps:
      - name: Build and push
        env:
          GIT_USERNAME: forgejo
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # The job's own token can't push packages. This org secret can.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          host=git.tailf69bc5.ts.net
          mkdir -p /kaniko/.docker
          auth=$(printf 'adham:%s' "$REGISTRY_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$host" "$auth" > /kaniko/.docker/config.json
          /kaniko/executor \
            --context "git://$host/$REPO.git#refs/heads/main#$SHA" \
            --destination "$host/$REPO:$SHA"
  browser:
    runs-on: docker
    env:
      # The Makefile installs the browser only when CI is set, so don't leave it to the runner.
      CI: "true"
      # WebGL draws on Mesa's llvmpipe under Xvfb, not SwiftShader: measured on the runner, a third of the CPU at the same
      # frame rate, so up to 3 jobs fit. 4 render threads per browser (2 halved the frame rate). tests/webgl.spec.ts fails
      # the job if Chromium falls back to SwiftShader, which it does without a display.
      LAB_WEBGL: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: "1"
      LP_NUM_THREADS: "4"
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      # CI only: Mesa's llvmpipe and the virtual display it draws through.
      - name: Install Mesa and Xvfb
        id: drivers
        run: |
          set -o pipefail
          { apt-get update && apt-get install -y --no-install-recommends libgl1-mesa-dri libegl-mesa0 libgbm1 xvfb xauth; } 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      - name: Run make browser PW_ARGS="--reporter=list,json"
        id: run
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright.json
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" make browser PW_ARGS="--reporter=list,json" 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so post the failure. On main that is a comment on the standing
      # "CI failures on main" issue. Best effort: it never changes the job result, and a failed post is only logged.
      - name: Post the failure
        if: failure()
        continue-on-error: true
        env:
          JOB: browser
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} drivers=${{ steps.drivers.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: xvfb-run make browser PW_ARGS="--reporter=list,json"
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          REPORT: ${{ runner.temp }}/playwright.json
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  # Takes every station at desktop and phone size, as ci.yml's screenshots job does on a PR, but posts nothing:
  # a shot that can't be taken stops the deploy.
  screenshots:
    runs-on: docker
    env:
      # Same renderer as the browser job.
      LAB_WEBGL: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: "1"
      LP_NUM_THREADS: "4"
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Install Mesa and Xvfb
        id: drivers
        run: |
          set -o pipefail
          { apt-get update && apt-get install -y --no-install-recommends libgl1-mesa-dri libegl-mesa0 libgbm1 xvfb xauth; } 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      - name: Take the screenshots
        id: run
        env:
          SHOTS_DIR: ${{ runner.temp }}/shots
        run: |
          set -o pipefail
          { npm ci && npx playwright install --with-deps chromium && xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test -c playwright.screenshots.config.ts --reporter=list; } 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so post the failure. On main that is a comment on the standing
      # "CI failures on main" issue. Best effort: it never changes the job result, and a failed post is only logged.
      - name: Post the failure
        if: failure()
        continue-on-error: true
        env:
          JOB: screenshots
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} drivers=${{ steps.drivers.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: npx playwright test -c playwright.screenshots.config.ts
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  staging:
    needs: [image, browser, screenshots]
    runs-on: docker
    # One staging push at a time. The tip-of-main check below is what stops an older run winning.
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Move the staging branch
        env:
          SHA: ${{ github.sha }}
        run: |
          # An older run must not overwrite a newer one. Each attempt reads where staging is, checks
          # this commit is still main's tip, then pushes only if staging hasn't moved since the read.
          # A refused push means another run got in between, so look again. At most 3 attempts.
          git config user.name forgejo-ci
          git config user.email ci@forgejo.local
          for attempt in 1 2 3; do
            if git fetch origin staging; then
              seen=$(git rev-parse FETCH_HEAD)
            else
              seen=""   # no staging branch yet: the empty lease means it must not exist
            fi
            git fetch origin main
            if [ "$(git rev-parse FETCH_HEAD)" != "$SHA" ]; then
              echo "main has moved past $SHA, so a newer run owns staging. Not pushing."
              exit 0
            fi
            git reset --hard "$SHA"
            sed -i -E "s/^(\s*tag:).*/\1 \"$SHA\"/" deploy/values-staging.yaml
            git commit -am "Deploy $SHA to staging"
            if git push --force-with-lease="refs/heads/staging:$seen" origin HEAD:refs/heads/staging; then
              exit 0
            fi
            echo "Push attempt $attempt was refused." >&2
          done
          echo "Staging push was refused 3 times." >&2
          exit 1
