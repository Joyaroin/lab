# A merge to main builds the image, then deploys it to staging: the staging job writes the tag into
# deploy/values-staging.yaml on the staging branch, the way promote does for production. Nothing
# here pushes to main, so a deploy adds no commit there and every merge to main runs this.
name: release
on:
  push:
    branches: [main]
jobs:
  image:
    runs-on: docker
    container:
      image: ghcr.io/osscontainertools/kaniko:v1.29.0-debug
    steps:
      - name: Build and push
        env:
          GIT_USERNAME: forgejo
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # The job's own token can't push packages. This org secret can.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          host=git.tailf69bc5.ts.net
          mkdir -p /kaniko/.docker
          auth=$(printf 'adham:%s' "$REGISTRY_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$host" "$auth" > /kaniko/.docker/config.json
          /kaniko/executor \
            --context "git://$host/${{ github.repository }}.git#refs/heads/main#${{ github.sha }}" \
            --destination "$host/${{ github.repository }}:${{ github.sha }}"
  staging:
    needs: image
    runs-on: docker
    # One staging push at a time. The tip-of-main check below is what stops an older run winning.
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Move the staging branch
        env:
          SHA: ${{ github.sha }}
        run: |
          # An older run must not overwrite a newer one: push only if this commit is still main's tip.
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$SHA" ]; then
            echo "main has moved past $SHA, so a newer run owns staging. Not pushing."
            exit 0
          fi
          sed -i -E "s/^(\s*tag:).*/\1 \"$SHA\"/" deploy/values-staging.yaml
          git config user.name forgejo-ci
          git config user.email ci@forgejo.local
          git commit -am "Deploy $SHA to staging"
          git push --force origin HEAD:refs/heads/staging
